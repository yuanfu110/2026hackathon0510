<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>遠端拍照控制</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #101214;
      color: #f5f7fa;
      text-align: center;
    }

    main {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 18px 14px 28px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 26px;
    }

    #latestImage {
      display: none;
      width: min(78vw, 500px);
      max-width: 100%;
      aspect-ratio: 3 / 5;
      border: 1px solid #2b3036;
      border-radius: 8px;
      background: #050607;
      clip-path: inset(0 0 0 100px);
      object-fit: cover;
    }

    .actions,
    .labels {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: #1677ff;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .label-button {
      min-width: 92px;
    }

    .label-white {
      background: #ffffff;
      color: #111827;
      border: 1px solid #d1d5db;
    }

    .label-blue {
      background: #2563eb;
    }

    .label-red {
      background: #dc2626;
    }

    .label-yellow {
      background: #facc15;
      color: #111827;
    }

    .label-black {
      background: #000000;
      border: 1px solid #4b5563;
    }

    #message {
      min-height: 28px;
      margin: 14px 0 0;
      color: #facc15;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <main>
    <h1>遠端拍照控制</h1>

    <img id="latestImage" alt="最新照片">

    <div class="actions">
      <button id="takePictureButton" type="button">拍照</button>
    </div>

    <div class="labels">
      {% for label_key, label in labels.items() %}
        <button
          class="label-button label-{{ label.color }}"
          type="button"
          data-label="{{ label_key }}"
          disabled
        >{{ label.name }}</button>
      {% endfor %}
    </div>

    <p id="message">等待最新照片</p>
  </main>

  <script>
    const latestImage = document.getElementById("latestImage");
    const takePictureButton = document.getElementById("takePictureButton");
    const labelButtons = Array.from(document.querySelectorAll(".label-button"));
    const message = document.getElementById("message");

    let latestUpdatedAt = "";

    function setLabelButtonsEnabled(enabled) {
      labelButtons.forEach((button) => {
        button.disabled = !enabled;
      });
    }

    async function refreshLatestPicture() {
      try {
        const response = await fetch("/api/latest-picture", { cache: "no-store" });
        const data = await response.json();

        if (!data.success || !data.has_image) {
          setLabelButtonsEnabled(false);
          return;
        }

        if (data.updated_at === latestUpdatedAt) {
          return;
        }

        latestUpdatedAt = data.updated_at;
        latestImage.src = `${data.image_url}?t=${encodeURIComponent(data.updated_at)}`;
        latestImage.style.display = "inline-block";
        setLabelButtonsEnabled(true);

        const resultText = data.main_result ? `\n辨識：${data.main_result}` : "";
        message.textContent = `最新照片：${data.updated_at}${resultText}`;
      } catch (error) {
        message.textContent = "讀取最新照片失敗";
        console.error(error);
      }
    }

    async function requestPicture() {
      takePictureButton.disabled = true;
      message.textContent = "已送出拍照指令，等待手機拍照...";

      try {
        const response = await fetch("/api/picture-command", { method: "POST" });
        const data = await response.json();

        if (!data.success) {
          message.textContent = "拍照指令送出失敗";
          return;
        }

        await refreshLatestPicture();
      } catch (error) {
        message.textContent = "拍照指令送出失敗";
        console.error(error);
      } finally {
        takePictureButton.disabled = false;
      }
    }

    async function submitLabel(label) {
      setLabelButtonsEnabled(false);
      message.textContent = "標記中...";

      const formData = new FormData();
      formData.append("label", label);

      try {
        const response = await fetch("/api/label-latest", {
          method: "POST",
          body: formData
        });
        const data = await response.json();

        if (!data.success) {
          message.textContent = "標記失敗：" + data.error;
          setLabelButtonsEnabled(true);
          return;
        }

        message.textContent = `已標記：${data.label}\n${data.image_path}`;
        setLabelButtonsEnabled(true);
      } catch (error) {
        message.textContent = "標記時發生錯誤";
        setLabelButtonsEnabled(true);
        console.error(error);
      }
    }

    takePictureButton.addEventListener("click", requestPicture);
    labelButtons.forEach((button) => {
      button.addEventListener("click", () => submitLabel(button.dataset.label));
    });

    refreshLatestPicture();
    window.setInterval(refreshLatestPicture, 1000);
  </script>
</body>
</html>
